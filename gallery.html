  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=2.0" />

</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Hu Group</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="people.html">People</a></li>
          <li class="nav-item"><a class="nav-link" href="publication.html">Publications</a></li>

          <li class="nav-item"><a class="nav-link" href="positions.html">Open Positions</a></li>
        </ul>

    </div>

  <header class="hero py-4">
    <div class="container py-3">
      <h1 class="section-title mb-1">Gallery</h1>
    </div>
  </header>

  <main class="container py-5">
    <div id="galleryGrid" class="row g-4 gallery-grid reveal-stagger"></div>
  </main>


  <footer class="footer py-4 mt-5">
    <div class="container small text-center">
      © 2025 Hu Group · Beijing Normal University, Zhuhai
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>


  <script>
    async function loadGallery() {
      const res = await fetch('assets/data/gallery.json?v=' + Date.now());
      const items = await res.json();
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = items.map(it => `
    <div class="col-sm-6 col-lg-4 reveal">
      <div class="card card-hover border-0 shadow-sm h-100">
        <img src="${it.src}" class="card-img-top" alt="${it.caption || 'photo'}" loading="lazy">
        <div class="card-body">
          <div class="small text-muted">${it.caption || ''}</div>
        </div>
      </div>
    </div>
  `).join('');

      // Re-observe newly created reveal elements
      const revealEls = grid.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        revealEls.forEach(el => observer.observe(el));
      } else {
        revealEls.forEach(el => el.classList.add('visible'));
      }
    }
    loadGallery().catch(err => {
      document.getElementById('galleryGrid').innerHTML = `<div class="text-danger">Failed to load gallery.json: ${err}</div>`;
    });
  </script>
</body>

</html>
