<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>People | Hu Group</title>
  <meta name="description"
    content="Meet the members of Hu Group – researchers and students in theoretical and computational chemistry at Beijing Normal University.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=2.1" />

</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Hu Group</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="people.html">People</a></li>
          <li class="nav-item"><a class="nav-link" href="publication.html">Publications</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="positions.html">Open Positions</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero py-4">
    <div class="container py-3">
      <h1 class="section-title mb-1">People</h1>
    </div>
  </header>

  <main class="container py-5">
    <div id="peopleSections">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Loading team members...
      </div>
    </div>
  </main>

  <footer class="footer py-4 mt-5">
    <div class="container small text-center">
      © 2025 Hu Group · Beijing Normal University, Zhuhai
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    async function loadPeople() {
      const res = await fetch('assets/data/people.json');
      const people = await res.json();
      const container = document.getElementById('peopleSections');

      const categories = [
        {
          id: 'pi',
          title: 'Principal Investigator',
          filter: p => (p.category === 'pi') || (!p.category && (p.role.toLowerCase().includes('investigator') || p.role.toLowerCase().includes('pi')))
        },
        {
          id: 'postdoc',
          title: 'Postdoctoral Researchers',
          filter: p => (p.category === 'postdoc') || (!p.category && p.role.toLowerCase().includes('postdoc'))
        },
        {
          id: 'graduate',
          title: 'Graduate Students',
          filter: p => (p.category === 'graduate') || (!p.category && (p.role.toLowerCase().includes('ph.d') || p.role.toLowerCase().includes('master')))
        },
        {
          id: 'undergraduate',
          title: 'Undergraduate Students',
          filter: p => (p.category === 'undergraduate') || (!p.category && p.role.toLowerCase().includes('undergraduate'))
        }
      ];

      container.innerHTML = categories.map(cat => {
        const members = people.filter(cat.filter);
        if (members.length === 0) return '';

        return `
          <section id="${cat.id}" class="category-section mb-5" style="scroll-margin-top: 80px;">
            <h2 class="h3 section-title mb-4">${cat.title}</h2>
            <div class="row g-4 reveal-stagger">
              ${members.map(p => `
                <div class="col-sm-6 col-lg-4 col-xl-3 reveal">
                  <div class="card h-100 border-0 shadow-sm card-hover">
                    <div class="card-body text-center p-4 d-flex flex-column align-items-center">
                      <img class="rounded-circle mb-3" src="${p.photo}" alt="${p.name} photo" style="width: 160px; height: 160px; object-fit: cover;" loading="lazy">
                      <h5 class="mb-1">${p.name}</h5>
                      <div class="text-muted small mb-3 fw-bold" style="font-size: 0.8rem; letter-spacing: 0.5px;">${p.role}</div>
                      <div class="mt-auto">
                        <a href="${p.url || 'profile.html?id=' + p.id}" class="btn btn-outline-dark btn-sm rounded-pill px-4">Learn More</a>
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');

      // Re-observe newly created reveal elements for animations
      const revealEls = container.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        revealEls.forEach(el => observer.observe(el));
      } else {
        revealEls.forEach(el => el.classList.add('visible'));
      }
    }

    loadPeople().catch(err => {
      document.getElementById('peopleSections').innerHTML = `<div class="text-danger">Failed to load team data: ${err}</div>`;
    });
  </script>
</body>

</html>
